blending_rules:
  - from: "*"
    to: "*"
    easing: "sineOut"
    duration: 0.4
  - from: "arms*"
    to: "*"
    easing: "sineInOut"
    duration: 0.7
  - from: "handhippose:*"
    to: "*"
    easing: "sineInOut"
    duration: 0.7
  - from: "pose*"
    to: "*"
    easing: "sineInOut"
    duration: 0.7
  - from: "readypose"
    to: "*"
    easing: "sineInOut"
    duration: 0.5
  - from: "gv*"
    to: "*"
    easing: "sineInOut"
    duration: 0.7
  - from: ""
    to: "*"
    easing: "linear"
    duration: 0.0
